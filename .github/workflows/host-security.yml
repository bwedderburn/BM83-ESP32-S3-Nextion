name: Host security and reliability policy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "32 15 * * 1"

permissions:
  contents: read

jobs:
  host-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install host-only tools
        run: python -m pip install -r requirements-reliability.txt
      - name: Validate reliability configuration
        run: python scripts/check_reliability_setup.py
      - name: Analyze production Python
        run: python -m bandit --ini .bandit -r firmware/circuitpython addons/universe-badge/apps/bm83_remote -ll
      - name: Audit development, MCP and native-build dependency pins
        run: |
          python -m pip_audit -r requirements-reliability.txt
          python -m pip_audit -r tools/mcp/repo_health/requirements.txt
          python -m pip_audit --disable-pip --no-deps -r tools/circuitpython-runtime/requirements-build.txt

name: Build CircuitPython drag-and-drop dist

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "firmware/circuitpython/**"
      - "build_mpy.sh"
      - ".github/workflows/build-circuitpython-dist.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip

      - name: Fetch CircuitPython mpy-cross (linux-amd64)
        run: |
          set -euo pipefail
          mkdir -p tools/mpy-cross
          cd tools/mpy-cross

          XML_URL="https://adafruit-circuit-python.s3.amazonaws.com/?prefix=bin/mpy-cross/linux-amd64/"
          
          # Pull listing (save for debugging)
          curl -fsSL "$XML_URL" -o listing.xml || {
            echo "ERROR: Failed to fetch S3 listing: $XML_URL" >&2
            exit 1
          }
          
          KEY="$(grep -oE '<Key>bin/mpy-cross/linux-amd64/[^<]*</Key>' listing.xml \
            | sed -E 's#</?Key>##g' \
            | grep -E 'mpy-cross-linux-amd64-[0-9]+\.[0-9]+\.[0-9]+' \
            | sort -V \
            | tail -n 1)"

          if [[ -z "$KEY" ]]; then
            echo "ERROR: Failed to locate mpy-cross key from S3 listing" >&2
            echo "URL used: $XML_URL" >&2
            echo "First 80 lines of raw XML response:" >&2
            sed -n '1,80p' listing.xml >&2
            echo "Attempting to list available keys (first 30):" >&2
            grep -oE '<Key>[^<]*</Key>' listing.xml | head -n 30 >&2 || true
            exit 1
          fi

          echo "Using: $KEY"

          # IMPORTANT: save as ./mpy-cross so MPY_CROSS can point to it predictably
          curl -fL -o mpy-cross "https://adafruit-circuit-python.s3.amazonaws.com/$KEY"
          chmod +x mpy-cross
          
          # Verify without failing due to help exit codes
          ./mpy-cross --version || true
          file ./mpy-cross

      - name: Build dist/
        env:
          MPY_CROSS: ${{ github.workspace }}/tools/mpy-cross/mpy-cross
        run: |
          chmod +x ./build_mpy.sh
          ./build_mpy.sh

      - name: Zip drag-and-drop package
        run: |
          cd dist
          zip -r circuitpython-dist-${{ github.sha }}.zip circuitpython

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: circuitpython-dist-${{ github.sha }}
          path: dist/circuitpython-dist-${{ github.sha }}.zip
          retention-days: 30

      # Optional: also upload the raw folder (handy for browsing without unzipping)
      - name: Upload artifact (folder)
        uses: actions/upload-artifact@v4
        with:
          name: circuitpython-folder-${{ github.sha }}
          path: dist/circuitpython
          retention-days: 30

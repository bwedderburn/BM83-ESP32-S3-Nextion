name: Build CircuitPython drag-and-drop dist

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "firmware/circuitpython/**"
      - "build_mpy.sh"
      - "scripts/fetch_mpy_cross.sh"
      - "tools/mpy_cross_pin.env"
      - ".github/workflows/build-circuitpython-dist.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "firmware/circuitpython/**"
      - "build_mpy.sh"
      - "scripts/fetch_mpy_cross.sh"
      - "tools/mpy_cross_pin.env"
      - ".github/workflows/build-circuitpython-dist.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip

      # Version + sha256 are pinned in tools/mpy_cross_pin.env (issue #148).
      # Bump the pin deliberately with the device's CircuitPython version.
      - name: Fetch pinned CircuitPython mpy-cross (linux-amd64)
        id: mpy_cross
        run: |
          set -euo pipefail
          ./scripts/fetch_mpy_cross.sh tools/mpy-cross/mpy-cross
          source tools/mpy_cross_pin.env
          echo "version=${MPY_CROSS_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build dist/
        env:
          MPY_CROSS: ${{ github.workspace }}/tools/mpy-cross/mpy-cross
        run: |
          chmod +x ./build_mpy.sh
          ./build_mpy.sh

      - name: Zip drag-and-drop package
        run: |
          cd dist
          zip -r circuitpython-dist-${{ github.sha }}.zip circuitpython BUILD_INFO.txt

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v7
        with:
          name: circuitpython-dist-mpy${{ steps.mpy_cross.outputs.version }}-${{ github.sha }}
          path: dist/circuitpython-dist-${{ github.sha }}.zip
          retention-days: 30

      # Optional: also upload the raw folder (handy for browsing without unzipping)
      - name: Upload artifact (folder)
        uses: actions/upload-artifact@v7
        with:
          name: circuitpython-folder-mpy${{ steps.mpy_cross.outputs.version }}-${{ github.sha }}
          path: dist/circuitpython
          retention-days: 30

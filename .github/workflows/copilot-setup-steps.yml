# Preinstalls the toolchain in the Copilot coding agent's ephemeral environment
# so agent sessions start with the same stack CI uses (flake8/pytest/bandit)
# plus the repo-health MCP server dependency.
#
# Rules (per GitHub docs): the job MUST be named copilot-setup-steps, and the
# file only takes effect once it is on the default branch.

name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install dev toolchain (matches python-package.yml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-reliability.txt
          pip install -e .

      - name: Install repo-health MCP server deps
        run: |
          python -m pip install -r tools/mcp/repo_health/requirements.txt

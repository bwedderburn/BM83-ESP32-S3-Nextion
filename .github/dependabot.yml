# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # Version-update proposals only; changing this frozen build snapshot needs review.
  - package-ecosystem: "pip"
    directory: "/tools/circuitpython-runtime"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    # Every bump rewrites requirements-build.txt and its recorded digest in
    # source-pins.json, so separate PRs conflict; batch minor/patch updates.
    groups:
      native-build-recipe:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # The esp_prov cap in espidf.constraints.v6.0.txt is copied from the pinned
      # ESP-IDF v6.0 constraints (protocolbuffers/protobuf#10075) and this recipe
      # does not install protobuf, so it moves with an ESP-IDF update, not PyPI.
      - dependency-name: "protobuf"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      # Editor stubs track the device's CircuitPython (tools/mpy_cross_pin.env);
      # bump them together with the firmware, not on the PyPI release cadence.
      - dependency-name: "circuitpython-stubs"

  # GitHub Actions in .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: "scope"

  # repo_health MCP server (tools/mcp/repo_health/requirements.txt)
  - package-ecosystem: "pip"
    directory: "/tools/mcp/repo_health"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: "scope"

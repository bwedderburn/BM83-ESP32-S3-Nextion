; BM83 wireless remote — CrowPanel ESP32 7" (non-Advance), repurposed from the
; solar-monitor wall HMI. Bring-up stage: panel + touch + stub token buttons.
;
; Hardware (Elecrow-RD/CrowPanel-7.0-HMI-ESP32-Display-800x480):
;   SoC ESP32-S3-WROOM-1-N4R8 (4 MB flash, 8 MB PSRAM octal)
;   Panel TN 800x480 RGB parallel (EK9716BD3 + EK73002ACGB), LovyanGFX Bus_RGB
;   Touch GT911 over I2C, SCL=GPIO20, SDA=GPIO19
;
; Display/touch/power bring-up (display_init, touch_panel, power) is copied
; verbatim from solar-monitor/firmware/crowpanel-hmi @ its 2026-10 state —
; same physical panel, factory pin map. lv_conf.h is the factory LVGL v8.3.5
; config. PCA9557 is Elecrow's MIT-licensed vendored copy under lib/.
;
; FLASH FROM WINDOWS POWERSHELL, NOT WSL (old apt platformio crashes; WSL
; can't see COM ports without usbipd):
;     cd C:\Users\brian\Repos\BM83-ESP32-S3-Nextion\firmware\crowpanel-remote
;     pio run -t upload
;
; THE CROWPANEL'S COM PORT MOVES between sessions, so the upload and
; monitor ports are pinned by USB VID:PID instead of a COM number:
; the CH340 (1A86:7523) is matched wherever it lands, and the BM83 audio
; board's CircuitPython console (303A:7003) can never match. NEVER override
; the port by habit — verify by VID/PID in Device Manager if in doubt.

[env:crowpanel_esp32s3_7in]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; N4R8: huge_app.csv = single ~3 MB app partition (no OTA; USB flashing only).
board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Resolve the CrowPanel's CH340 by hardware ID, not by a dated COM number:
; select_port.py sets upload_port to whichever COM the CH340 (1A86:7523)
; holds right now, and leaves it unset if the device is absent or
; ambiguous — upload then stops instead of guessing at another board.
; hwgrep:// does the same for the serial monitor.
extra_scripts = pre:select_port.py
monitor_port = hwgrep://1A86:7523

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -I src
    ; Battery gauge: Brian's solder mod, carried over with the panel from the
    ; solar HMI — BAT+ -> 100 k -> IO17 -> 100 k -> GND. IO17 (ADC2 ch6) is
    ; the cleanest free ADC pin on this board; it is also the NS4168 amp's
    ; SDATA input, unused here. ADC2 shares its converter with WiFi, so a
    ; read can collide with the radio; battery.cpp's trimmed mean drops
    ; those. Set 0 to disable (gauge "--%", USB timings always).
    -DBATTERY_ADC_PIN=17
    ; Compound ratio calibrated 2026-05-16 against a DMM (BAT+ 4.10 V, ADC
    ; pin 1.65 V): the 2:1 divider sits near 2.37:1 because the NS4168
    ; input and the ADC load the lower leg, and the S3 ADC reads ~5% low
    ; here. Re-measure BAT+, midpoint and the logged pin voltage if the
    ; wiring or resistors change.
    -DBATTERY_DIVIDER_RATIO=2.485f

lib_deps =
    ; LVGL pinned to the factory-demo-compatible line (flush_cb signature).
    lvgl/lvgl@~8.3.11
    ; LovyanGFX Bus_RGB/Panel_RGB used by display_init.cpp (LGFX_USE_V1).
    lovyan03/LovyanGFX@^1.2.0
    ; GT911 touch — exact library the factory bring-up uses, pinned to the
    ; hardware-verified commit (a bare branch URL drifts silently).
    https://github.com/TAMCTec/gt911-arduino.git#b3f175e
